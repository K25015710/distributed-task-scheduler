[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dtsched"
version = "0.1.0"
description = "A distributed task scheduler with leases, heartbeats, retries and a dead-letter queue."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
keywords = ["task-queue", "scheduler", "distributed-systems", "workers", "retries"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
dtsched = "dtsched.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dtsched"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
